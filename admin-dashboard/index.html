<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabiao SHS — Attendance Admin</title>
<style>
  :root {
    --green: #1B5E20;
    --green-dark: #14451a;
    --green-light: #e8f5e9;
    --orange: #E65100;
    --red: #B3261E;
    --red-dark: #8c1a13;
    --bg: #f4f6f4;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e2e6e2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    background: var(--green);
    color: #fff;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 600; margin-right: auto; }
  header .user { font-size: 13px; opacity: .9; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav a {
    color: #fff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    opacity: .85;
  }
  nav a:hover { background: rgba(255,255,255,.12); opacity: 1; }
  nav a.active { background: rgba(255,255,255,.2); opacity: 1; font-weight: 600; }
  button {
    font: inherit;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    background: var(--green);
    color: #fff;
  }
  button:hover { background: var(--green-dark); }
  button.secondary { background: #fff; color: var(--green); border: 1px solid var(--green); }
  button.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.link { background: none; border: none; color: var(--red); padding: 0 4px; font-size: 13px; }
  button.link:hover { background: none; color: var(--red-dark); text-decoration: underline; }
  .dev-chip { display: inline-block; background: var(--green-light); border: 1px solid var(--border); border-radius: 10px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 12px; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 60px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card .num { font-size: 28px; font-weight: 700; color: var(--green); }
  .card .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  .panel h2 { font-size: 15px; margin-bottom: 12px; color: var(--green-dark); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  tr:hover td { background: var(--green-light); }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.in { background: #c8e6c9; color: var(--green-dark); }
  .badge.out { background: #ffe0b2; color: var(--orange); }
  .badge.off { background: #f3f4f3; color: var(--muted); }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input, select {
    font: inherit;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
  }
  input:focus, select:focus { outline: 2px solid var(--green); outline-offset: -1px; }
  .form-actions { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; }
  .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
  .msg.ok { background: #e8f5e9; color: var(--green-dark); border: 1px solid #a5d6a7; }
  .msg.err { background: #fdecea; color: var(--red); border: 1px solid #f5c2c0; }
  .login-wrap { max-width: 380px; margin: 12vh auto 0; }
  .login-wrap .panel h2 { font-size: 18px; text-align: center; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input { max-width: 200px; }
  .toolbar select { width: 160px; }
  .toolbar label { margin-bottom: 2px; }
  .empty { color: var(--muted); padding: 18px; text-align: center; }
  .muted { color: var(--muted); font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  .section-head td { background: var(--green-light); color: var(--green-dark); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .dept-head td { background: #f1f6f1; color: var(--green-dark); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .live-gray td { color: var(--muted); background: #fafbfa; }
  .live-gray:hover td { background: #f2f4f2; }
  .dept-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .dept-card {
    text-align: left;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    font: inherit;
    color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  .dept-card:hover { border-color: var(--green); box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .dept-card.all { border-color: var(--green); background: var(--green-light); }
  .dept-card.all .dept-name { color: var(--green); }
  .dept-card .dept-name { font-size: 13px; color: var(--green-dark); font-weight: 700; margin-bottom: 8px; }
  .dept-card .num { font-size: 30px; font-weight: 800; color: var(--green); }
  .dept-card .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
  #backToDepts { margin-bottom: 12px; }
</style>
</head>
<body>
<header id="header" hidden>
  <h1>Cabiao SHS — Attendance</h1>
  <nav>
    <a href="#/dashboard" data-view="dashboard">Dashboard</a>
    <a href="#/accounts" data-view="accounts">Accounts</a>
    <a href="#/records" data-view="records">Records</a>
    <a href="#/overrides" data-view="overrides">Overrides</a>
    <a href="#/settings" data-view="settings">Settings</a>
  </nav>
  <span class="user" id="userLabel"></span>
  <button class="secondary" id="logoutBtn">Log out</button>
</header>
<main id="view"></main>
<script src="./js/config.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
